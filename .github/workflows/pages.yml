name: Painel no GitHub Pages

# Publica o Painel Unificado (Delicadeza Visual) como prévia pública estática com dados 100% SINTÉTICOS.
# O pacote é gerado a partir do próprio código do repositório e validado (sem PII, sem credenciais,
# paleta de 240 cores) antes de qualquer envio. Dados reais nunca são publicados por este workflow.
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "observatorio/web/unificado/**"
      - "observatorio/operacao/previa_sintetica.py"
      - "scripts/preparar_previa_github_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Gerar e validar o pacote sintético (falha fechada)
        run: |
          python -m pip install -q -r requirements-dev.txt
          python scripts/preparar_previa_github_pages.py --saida _site
          touch _site/.nojekyll
          sha256sum _site/index.html | tee -a "$GITHUB_STEP_SUMMARY"
      # Ativação única pelo responsável: Settings > Pages > Source: "GitHub Actions" (ver docs/OPERACAO.md).
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publicar:
    needs: construir
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
